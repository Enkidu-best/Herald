# scripts/check_all.sh (общий блок ci): что проверять перед push. Облако - свои проверки (.github/workflows/ci.yml).
RUFF_PATHS=(tts_gui.py cli.py player.py theme.py core)   # как «Инструменты разработки/test_lint.py»
export HERALD_STRESS_CALIBRATE=0
T="Инструменты разработки"
# без модели и без окна: то же, что в облаке до первой модели
unit() {
  "$PY" common/lock/tests/test_heavy_lock.py && "$PY" "$T/test_mlxthread.py" && "$PY" common/tts_client/tests/test_split.py &&
    "$PY" "$T/test_speak_lang.py" && "$PY" "$T/test_pauses.py" --fast && "$PY" "$T/test_words.py" &&
    "$PY" "$T/test_stream.py" && "$PY" "$T/test_normalize.py" && "$PY" "$T/test_forecast_cache.py" &&
    "$PY" "$T/i18n_keys.py" --missing && "$PY" "$T/test_trash_fix.py"
}
# окно на своих данных (стандарт 6.10)
ui() { "$PY" "$T/test_gui.py"; }
