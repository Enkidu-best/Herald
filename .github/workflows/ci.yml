name: Проверки (Windows, Linux)

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  HERALD_STRESS_CALIBRATE: "0"     # тестовый набор ударений - не на процессоре CI
  HERALD_HOME_NOTE: "голоса для клона делаются тут же из Silero - чужих образцов в репозитории нет"

jobs:
  linux:
    name: Linux · процессор
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg, PortAudio, Tk
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2 python3-tk
      - name: torch для процессора
        run: pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Зависимости
        run: pip install -r requirements-pc.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-linux-herald-v1
      - name: Статическая проверка кода (ruff F821, F841, B023 - стандарт 6.11)
        run: pip install ruff==0.6.9 && python "Инструменты разработки/test_lint.py"
      - name: Чем считается
        run: python cli.py --engine-info
      - name: Очередь видеокарты (общий модуль) и одна нить MLX (без модели)
        run: python common/lock/tests/test_heavy_lock.py && python "Инструменты разработки/test_mlxthread.py" && python common/tts_client/tests/test_split.py && python "Инструменты разработки/test_speak_lang.py"
      - name: Паузы (без модели)
        run: python "Инструменты разработки/test_pauses.py" --fast
      - name: Сверка слов (без модели)
        run: python "Инструменты разработки/test_words.py"
      - name: Звук потоком (без модели, заглушка движка)
        run: python "Инструменты разработки/test_stream.py"
      - name: Числа и сокращения (ru-normalizr)
        run: python "Инструменты разработки/test_normalize.py"
      - name: Ударения
        run: python "Инструменты разработки/test_stress.py"
      - name: Прогноз с кэшем и чтец в тегах (без модели)
        run: python "Инструменты разработки/test_forecast_cache.py"
      - name: /speak для Interview Coach - как раньше (WAV 48 кГц, каталог голосов)
        run: python "Инструменты разработки/scenario_speak.py"
      - name: Словарь интерфейса EN - нет пропущенных ключей
        run: python "Инструменты разработки/i18n_keys.py" --missing
      - name: Голоса - нет сети, Piper с pypi.org, Vosk, удаление
        run: python "Инструменты разработки/scenario_voices.py"
      - name: Пробник Silero и клон F5 на процессоре
        run: python "Инструменты разработки/smoke_pc.py"
      - name: Время первого звука (Silero и /speak)
        run: python "Инструменты разработки/bench_live.py" --case silero --repeat 3 && python "Инструменты разработки/bench_live.py" --case server --repeat 3
      - name: Окно без человека на своих данных (Xvfb; проверки «нужен Mac» - пропуск с причиной)
        run: sudo apt-get install -y xvfb && xvfb-run -a -s "-screen 0 1920x1080x24" python "Инструменты разработки/test_gui.py"
      - name: Корзина и поправки ударений (без модели)
        run: python "Инструменты разработки/test_trash_fix.py"
      - name: Журнал Herald (при сбое)
        if: failure()
        run: cat ~/.local/state/Herald/log/herald.log || true

  windows:
    name: Windows · процессор
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Зависимости
        run: pip install -r requirements-pc.txt
      - uses: actions/cache@v4
        with:
          path: |
            ~\.cache\huggingface
            ~\.cache\torch
          key: hf-windows-herald-v1
      - name: Чем считается
        run: python cli.py --engine-info
      - name: Паузы (без модели)
        run: python "Инструменты разработки/test_pauses.py" --fast
      - name: Сверка слов (без модели)
        run: python "Инструменты разработки/test_words.py"
      - name: Звук потоком (без модели, заглушка движка)
        run: python "Инструменты разработки/test_stream.py"
      - name: Числа и сокращения (ru-normalizr)
        run: python "Инструменты разработки/test_normalize.py"
      - name: Ударения
        run: python "Инструменты разработки/test_stress.py"
      - name: Прогноз с кэшем и чтец в тегах (без модели)
        run: python "Инструменты разработки/test_forecast_cache.py"
      - name: /speak для Interview Coach - как раньше (WAV 48 кГц, каталог голосов)
        run: python "Инструменты разработки/scenario_speak.py"
      - name: Словарь интерфейса EN - нет пропущенных ключей
        run: python "Инструменты разработки/i18n_keys.py" --missing
      - name: Голоса - нет сети, Piper с pypi.org, Vosk, удаление
        run: python "Инструменты разработки/scenario_voices.py"
      - name: Пробник Silero и клон F5 на процессоре
        run: python "Инструменты разработки/smoke_pc.py"
      - name: Время первого звука (Silero и /speak)
        run: python "Инструменты разработки/bench_live.py" --case silero --repeat 3 && python "Инструменты разработки/bench_live.py" --case server --repeat 3
      - name: Ссылка на ускорение NVIDIA (без скачивания)
        run: python -c "from core.cuda_pack import wheel_url; print(wheel_url())"
      - name: Журнал Herald (при сбое)
        if: failure()
        shell: pwsh
        run: Get-Content "$env:LOCALAPPDATA\Herald\Logs\herald.log" -ErrorAction SilentlyContinue
