name: Установщик для Windows

on:
  push:
    tags: ["v*"]
    branches: ["dev/**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    name: Сборка, установка, проверка
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pc.txt pyinstaller
      - name: ffmpeg (сборка LGPL от BtbN)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest | ConvertFrom-Json
          $a = $rel.assets | Where-Object { $_.name -match '^ffmpeg-n8\.\d+-latest-win64-lgpl-8\.\d+\.zip$' } | Select-Object -First 1
          if (-not $a) { $a = $rel.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-lgpl.zip' } | Select-Object -First 1 }
          Write-Host "ffmpeg: $($a.name)"
          Invoke-WebRequest $a.browser_download_url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_x
          $bin = (Get-ChildItem ffmpeg_x -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force packaging\ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe", "$bin\ffprobe.exe" packaging\ffmpeg\
          $lic = Get-ChildItem ffmpeg_x -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName packaging\ffmpeg\LICENSE.txt }
          "$($a.name) - https://github.com/BtbN/FFmpeg-Builds (LGPL)" | Out-File packaging\ffmpeg\VERSION.txt -Encoding utf8
      - name: Иконка
        run: python -c "from PIL import Image; Image.open('assets/icon.png').save('packaging/herald.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: PyInstaller (папка)
        run: pyinstaller packaging/herald.spec --noconfirm --distpath dist --workpath build
      - name: ffmpeg - в сборку
        shell: pwsh
        run: Copy-Item packaging\ffmpeg dist\Herald\ffmpeg -Recurse
      - name: В сборке нет аудио и образцов голосов
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist\Herald -Recurse -File | Where-Object { $_.Extension -in '.mp3','.wav','.flac','.m4a','.m4b','.fb2','.epub' }
          if ($bad) { $bad | ForEach-Object { Write-Host $_.FullName }; throw "в сборке аудио или книги" }
      - name: В сборке нет движка Piper (GPL - скачивается по кнопке)
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist\Herald -Recurse -Directory | Where-Object { $_.Name -match '^piper' }
          if ($bad) { $bad | ForEach-Object { Write-Host $_.FullName }; throw "в сборке движок Piper" }
          if (-not (Test-Path dist\Herald\_internal\assets\i18n\en.json) -and -not (Test-Path dist\Herald\assets\i18n\en.json)) { throw "в сборке нет словаря EN" }
      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -match '^v(\d.*)$') { $v = $Matches[1] } else { $v = "3.2" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\herald.iss
      - name: Размеры
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "Herald-Setup-*.exe" | Select-Object -First 1
          $folder = (Get-ChildItem dist\Herald -Recurse -File | Measure-Object -Property Length -Sum).Sum
          $torch = (Get-ChildItem dist\Herald -Recurse -File | Where-Object { $_.FullName -match '\\torch\\' } | Measure-Object -Property Length -Sum).Sum
          $lines = @("Установщик: $([math]::Round($setup.Length/1MB)) МБ ($($setup.Name))",
                     "Папка программы после установки: $([math]::Round($folder/1MB)) МБ",
                     "  из них torch: $([math]::Round($torch/1MB)) МБ")
          $lines | Tee-Object dist\sizes.txt
      - name: Тихая установка, пробник Silero и клон F5, удаление
        shell: pwsh
        run: |
          $env:PATH = "$PWD\packaging\ffmpeg;" + $env:PATH
          $setup = Get-ChildItem dist -Filter "Herald-Setup-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/DIR=C:\HeraldTest' -Wait
          if (-not (Test-Path C:\HeraldTest\Herald.exe)) { throw "Herald.exe не установлен" }
          C:\HeraldTest\herald-cli.exe --engine-info
          $env:HERALD_SMOKE_REPORT = "$PWD\dist\smoke.json"
          python "Инструменты разработки/smoke_pc.py" --exe C:\HeraldTest\herald-cli.exe
          if ($LASTEXITCODE -ne 0) { throw "пробник не прошёл" }
          Start-Process C:\HeraldTest\unins000.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 3
          if (Test-Path C:\HeraldTest\Herald.exe) { throw "не удалилось" }
          "Тихая установка, пробник (Silero и клон F5) и удаление прошли" | Tee-Object -Append dist\sizes.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Herald-Setup
          path: |
            dist/Herald-Setup-*.exe
            dist/sizes.txt
            dist/smoke.json
      - name: В релиз
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Herald $tag" --notes-file "docs/Релиз 3.2.md" }
          gh release upload $tag (Get-ChildItem dist -Filter "Herald-Setup-*.exe").FullName dist\sizes.txt --clobber
